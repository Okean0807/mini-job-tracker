name: Secret scan

on:
  # Every branch push: incremental before..after range (new branch / force-push ->
  # full ancestry of the tip, see gitleaks-range.sh), so leaks are caught before a PR.
  push:
    branches: ["**"]
  # PRs into main: merge-base..head, the authoritative pre-merge check.
  pull_request:
    branches: [main]
  workflow_dispatch: # manual full-history scan (--all)
  schedule:
    - cron: "17 3 * * 1" # weekly full-history scan, Monday 03:17 UTC

# PRs: superseded runs are cancelled, the latest head is always scanned.
# pushes (any branch) / manual / scheduled: never cancelled, each run gets its own group
# (run_id) so a full scan can never mask or be masked by another run.
concurrency:
  group: >-
    secret-scan-${{ github.event_name }}-${{
      github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, taken from the release's gitleaks_8.30.1_checksums.txt
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          rm -f "$tarball"
          ./gitleaks version

      - name: Range-resolution self-test (synthetic secrets in throwaway repos)
        run: |
          set -euo pipefail
          GITLEAKS="$PWD/gitleaks" bash .github/scripts/test-gitleaks-range.sh

      - name: gitleaks (redacted)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          GITLEAKS: ./gitleaks
        run: |
          set -euo pipefail
          bash .github/scripts/gitleaks-scan.sh

      # Also on push / PR: the git-range scan cannot see content that only exists in a
      # merge commit's conflict resolution ("evil merge", see test-gitleaks-range.sh);
      # scanning the checked-out tree closes that gap before merge (~1 s, redacted).
      - name: gitleaks dir scan of current tree (redacted)
        run: |
          set -euo pipefail
          ./gitleaks dir --no-banner --redact --verbose --exit-code 1 .
