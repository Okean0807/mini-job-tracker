name: Vitest

on:
  # Every branch is checked on push, so feature branches get results before a PR exists.
  push:
    branches: ["**"]
  # PRs into main additionally test the merge result (refs/pull/N/merge), which the
  # push run on the branch head does not cover.
  pull_request:
    branches: [main]

concurrency:
  group: vitest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Same bun as the Vercel build (bun install v1.3.14 in build logs).
          bun-version: "1.3.14"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      # Run even if Test failed, so every check reports on its own.
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: bunx tsc --noEmit -p .
      - name: XLSX boundary guard
        if: ${{ !cancelled() }}
        run: bun run assert:xlsx-boundary
