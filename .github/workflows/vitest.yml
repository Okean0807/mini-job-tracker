name: Vitest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: vitest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      # Run even if Test failed, so every check reports on its own.
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: bunx tsc --noEmit -p .
      - name: XLSX boundary guard
        if: ${{ !cancelled() }}
        run: bun run assert:xlsx-boundary
