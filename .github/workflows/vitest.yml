name: Vitest

on:
  # Every branch is checked on push, so feature branches get results before a PR exists.
  push:
    branches: ["**"]
  # PRs from this repository are already covered by the push run on the same head
  # commit (checks attach to the commit); only fork PRs need their own run (job `if`).
  pull_request:
    branches: [main]

concurrency:
  group: vitest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun run test
